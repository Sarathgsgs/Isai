name: Build and Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            grep -E "^e: " build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            FAIL_ERR=$(grep -A 10 "What went wrong:" build.log | tr '\n' ' ' | cut -c 1-1000)
            echo "::error title=WhatWentWrong::$FAIL_ERR"
            exit 1
          fi

      - name: Upload Build Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-log
          path: build.log

      - name: Push Build Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add build.log
          git commit -m "build failure log" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs || true

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Isai-v1.3.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: 'Isai Music Player v1.3.0'
          body: |
            ## 🎵 Isai Offline Music Player v1.3.0 (Release 2)
            
            Download and install the updated APK directly on your Android phone!
            
            ### ✨ What's New in v1.3.0:
            - **Downloads Folder Selection**: Seamlessly scan and index all audio from your device's `/Download` directory without Android 11+ SAF root blocks.
            - **Multi-Directory Library Support**: Add and manage multiple distinct music folders simultaneously (e.g., Downloads, SD Card, Music albums).
            - **Tonearm Tap-to-Resume**: Touching or tapping anywhere on the tonearm bar when paused drops the needle and instantly resumes playback.
            - **Buttery-Smooth Waveform Playcursor**: 60fps drag scrubbing with decoupled pointer tracking and zero lag or cursor freeze.
            - **Full-Bleed Picture Disc Vinyl**: High-fidelity album art coverage across the entire rotating 33⅓ RPM disc with concentric grooves and translucent spindle hub.
            - **Offline Synced Lyrics, Parametric Equalizer, Android Auto & Glance Widget**.
            - **100% Offline & Private**: Zero internet permissions requested.
            
            ### 📲 Installation Instructions:
            1. Download `app-debug.apk` directly on your phone or transfer it from your laptop.
            2. Open the file and allow "Install from unknown sources" if prompted.
            3. Enjoy high-fidelity offline vinyl listening!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
