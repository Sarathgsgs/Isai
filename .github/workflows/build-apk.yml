name: Build and Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            KOTLIN_ERRS=$(grep -E "^e: " build.log | head -n 15 | tr '\n' ' ' | cut -c 1-450)
            FAIL_ERR=$(grep -A 10 "What went wrong:" build.log | tr '\n' ' ' | cut -c 1-400)
            echo "::error title=KotlinErrors::$KOTLIN_ERRS"
            echo "::error title=WhatWentWrong::$FAIL_ERR"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isai-v1.2.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: 'v1.2.0'
          name: 'Isai Music Player v1.2.0'
          body: |
            ## 🎵 Isai Offline Music Player v1.2.0
            
            Download and install the APK directly on your Android phone!
            
            ### ✨ Highlights:
            - **Turntable UI**: 33⅓ RPM rotating vinyl record with draggable aluminum tonearm & tactile drop/lift physics.
            - **Waveform Seekbar**: Audio amplitude peaks with smooth scrub arbitration.
            - **Offline Synced Lyrics**: Karaoke scrolling with tap-to-seek & Romanized text.
            - **Parametric Equalizer**: 5/10-band Catmull-Rom spline curve with clipping guard.
            - **Android Auto**: MediaLibraryService integration with voice search.
            - **M3U Playlists**: Import/export with fuzzy track matching.
            - **Glance Widget**: 4x2 interactive home-screen widget.
            - **100% Offline & Private**: Zero internet permissions requested.
            
            ### 📲 Installation Instructions:
            1. Download `app-debug.apk` directly on your phone or transfer it from your laptop.
            2. Open the file and allow "Install from unknown sources" if prompted.
            3. Enjoy high-fidelity offline vinyl listening!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
